<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img" aria-label="Rakesh Kumar live GitHub activity dashboard">
  <title>Rakesh Kumar — Live GitHub Activity</title>
  <defs>
    <style><![CDATA[
      text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
      @keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      @keyframes glow{0%,100%{opacity:.65}50%{opacity:1}}
      @keyframes sweep{0%{transform:translateX(-260px) skewX(-18deg)}65%,100%{transform:translateX(1220px) skewX(-18deg)}}
      .enter{opacity:0;animation:enter .55s ease forwards;transform-box:fill-box}
      .pulse{animation:glow 2.4s ease-in-out infinite}
      .sweep{animation:sweep 6s ease-in-out 1.8s infinite}
    ]]></style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0718"/><stop offset=".52" stop-color="#120b20"/><stop offset="1" stop-color="#08111d"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e879f9"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff7eb6"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="dotGrid" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="9" height="9" rx="2" fill="#24183a"/></pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1098" height="618" rx="24"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1098" height="618" rx="24" fill="url(#background)" stroke="url(#border)" stroke-opacity=".62" stroke-width="2"/>
  <circle cx="100" cy="40" r="150" fill="#e879f9" opacity=".035"/><circle cx="1010" cy="560" r="220" fill="#22d3ee" opacity=".035"/>
  <g clip-path="url(#frame)" pointer-events="none"><rect class="sweep" x="-260" y="0" width="150" height="620" fill="url(#shine)"/></g>

  <g class="enter" style="animation-delay:.1s">
    <circle cx="48" cy="45" r="6" fill="#22d3ee" class="pulse" filter="url(#softGlow)"/>
    <text x="68" y="52" font-size="22" font-weight="700" fill="#f8fafc">GITHUB ACTIVITY CONSOLE</text>
    <text x="1050" y="51" text-anchor="end" font-size="13" fill="#94a3b8">@deBUGger404 · LIVE</text>
    <line x1="40" y1="72" x2="1060" y2="72" stroke="#34264c"/>
  </g>

  <g class="enter" style="animation-delay:.25s">
    <rect x="40" y="94" width="500" height="214" rx="18" fill="#151024" stroke="#3c2c59"/>
    <text x="66" y="126" font-size="15" font-weight="700" fill="#e879f9">// PROFILE SIGNAL</text>
    <text x="66" y="158" font-size="11" fill="#64748b">PUBLIC REPOSITORIES</text>
    <text id="activity-repos" x="66" y="193" font-size="29" font-weight="700" fill="#f8fafc">18</text>
    <text x="290" y="158" font-size="11" fill="#64748b">EARNED STARS</text>
    <text id="activity-stars" x="290" y="193" font-size="29" font-weight="700" fill="#fde047">24</text>
    <text x="66" y="235" font-size="11" fill="#64748b">FOLLOWERS</text>
    <text id="activity-followers" x="66" y="270" font-size="29" font-weight="700" fill="#22d3ee">5</text>
    <text x="290" y="235" font-size="11" fill="#64748b">YEARLY CONTRIBUTIONS</text>
    <text id="activity-contributions" x="290" y="270" font-size="29" font-weight="700" fill="#ff7eb6">214</text>
    <path d="M450 130h38v38h-38z" fill="none" stroke="#8b5cf6" stroke-width="2" transform="rotate(45 469 149)" opacity=".35"/>
    <circle cx="469" cy="149" r="9" fill="#8b5cf6" opacity=".75" class="pulse"/>
  </g>

  <g class="enter" style="animation-delay:.4s">
    <rect x="560" y="94" width="500" height="214" rx="18" fill="#151024" stroke="#3c2c59"/>
    <text x="586" y="126" font-size="15" font-weight="700" fill="#22d3ee">// REPOSITORY LANGUAGE MIX</text>
    <g font-size="12">
      <circle id="lang-dot-1" cx="590" cy="158" r="5" fill="#3572A5"/><text id="lang-name-1" x="604" y="162" fill="#cbd5e1">Python</text><text id="lang-percent-1" x="1028" y="162" text-anchor="end" fill="#94a3b8">43.8%</text>
      <circle id="lang-dot-2" cx="590" cy="187" r="5" fill="#DA5B0B"/><text id="lang-name-2" x="604" y="191" fill="#cbd5e1">Jupyter Notebook</text><text id="lang-percent-2" x="1028" y="191" text-anchor="end" fill="#94a3b8">25.0%</text>
      <circle id="lang-dot-3" cx="590" cy="216" r="5" fill="#e34c26"/><text id="lang-name-3" x="604" y="220" fill="#cbd5e1">HTML</text><text id="lang-percent-3" x="1028" y="220" text-anchor="end" fill="#94a3b8">12.5%</text>
      <circle id="lang-dot-4" cx="590" cy="245" r="5" fill="#f1e05a"/><text id="lang-name-4" x="604" y="249" fill="#cbd5e1">JavaScript</text><text id="lang-percent-4" x="1028" y="249" text-anchor="end" fill="#94a3b8">12.5%</text>
      <circle id="lang-dot-5" cx="590" cy="274" r="5" fill="#3178c6"/><text id="lang-name-5" x="604" y="278" fill="#cbd5e1">TypeScript</text><text id="lang-percent-5" x="1028" y="278" text-anchor="end" fill="#94a3b8">6.2%</text>
    </g>
    <rect x="586" y="291" width="442" height="5" rx="2.5" fill="#24183a"/>
    <rect id="lang-bar-1" x="586" y="291" width="193.6" height="5" rx="2.5" fill="#3572A5"/>
    <rect id="lang-bar-2" x="779.6" y="291" width="110.5" height="5" fill="#DA5B0B"/>
    <rect id="lang-bar-3" x="890.1" y="291" width="55.25" height="5" fill="#e34c26"/>
    <rect id="lang-bar-4" x="945.35" y="291" width="55.25" height="5" fill="#f1e05a"/>
    <rect id="lang-bar-5" x="1000.6" y="291" width="27.4" height="5" rx="2.5" fill="#3178c6"/>
  </g>

  <g class="enter" style="animation-delay:.55s">
    <rect x="40" y="328" width="1020" height="86" rx="18" fill="#151024" stroke="#3c2c59"/>
    <text x="66" y="360" font-size="13" fill="#94a3b8">CURRENT STREAK</text>
    <text id="activity-current-streak" x="66" y="394" font-size="28" font-weight="700" fill="#22d3ee">0 days</text>
    <line x1="340" y1="350" x2="340" y2="394" stroke="#34264c"/>
    <text x="376" y="360" font-size="13" fill="#94a3b8">LONGEST STREAK</text>
    <text id="activity-longest-streak" x="376" y="394" font-size="28" font-weight="700" fill="#8b5cf6">3 days</text>
    <line x1="680" y1="350" x2="680" y2="394" stroke="#34264c"/>
    <text x="716" y="360" font-size="13" fill="#94a3b8">DATA WINDOW</text>
    <text id="activity-date-range" x="716" y="393" font-size="15" font-weight="700" fill="#f8fafc">LAST 12 MONTHS</text>
  </g>

  <g class="enter" style="animation-delay:.7s">
    <text x="40" y="453" font-size="15" font-weight="700" fill="#ff7eb6">// CONTRIBUTION HEATMAP</text>
    <text x="1060" y="453" text-anchor="end" font-size="11" fill="#64748b">LESS  ▪ ▪ ▪ ▪ ▪  MORE</text>
    <rect x="40" y="470" width="1020" height="108" rx="14" fill="#100b1b" stroke="#2d2141"/>
    <rect x="60" y="485" width="980" height="80" fill="url(#dotGrid)" opacity=".42"/>
    <g id="contribution-grid"></g>
    <text id="activity-sync-note" x="550" y="530" text-anchor="middle" font-size="13" fill="#64748b">Live calendar fills automatically after the first GitHub Action run</text>
  </g>

  <circle cx="42" cy="598" r="3" fill="#22c55e"/><text x="54" y="602" font-size="11" fill="#64748b">REPOSITORIES · LANGUAGES · CONTRIBUTIONS</text>
  <text x="1058" y="602" text-anchor="end" font-size="11" fill="#64748b">DATA → CONTEXT → INTELLIGENCE</text>
</svg>
